name: Update latest Medium post

on:
  schedule:
    - cron: "0 0 * * *"   # daily, 09:00 KST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/update_latest_post.py
      - name: Commit if the latest post changed
        run: |
          if ! git diff --quiet data/latest-post.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "Update latest Medium post"
            git push
          fi
